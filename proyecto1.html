<head>

    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030108;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
        }

        /* Canvas Base */

        #galaxia {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Lluvia de fotos Container */

        .lluvia-contenedor {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }

        /* Polaroid Photo Card Styling */

        .foto-card {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            animation: caerFotos linear infinite;
            will-change: transform, top, opacity;
            transition: filter 0.1s ease;
        }

        .marco-polaroid {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 10px 14px 10px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 215, 0, 0.2);
            width: 135px;
            text-align: center;
            border: 1px solid rgba(255, 230, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .marco-polaroid img {
            width: 100%;
            height: 125px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            background-color: #1a162b;
            transition: transform 0.1s ease;
        }

        .nota {
            font-family: 'Dancing Script', cursive;
            font-size: 1.25rem;
            color: #162447;
            margin-top: 8px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.1s ease;
        }

        /* Animaciones Hover Mejoradas */

        .foto-card:hover {
            animation-play-state: paused !important;
            z-index: 100 !important;
        }

        .foto-card:hover .marco-polaroid {
            transform: scale(1.32) rotate(0deg) translateY(-10px);
            border-color: rgba(255, 230, 0, 1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 35px rgba(251, 191, 36, 0.85);
            background: #ffffff;
        }

        .foto-card:hover .marco-polaroid img {
            transform: scale(1.03);
        }

        .foto-card:hover .nota {
            color: #d97706;
        }

        /* Keyframes para la caída continuo de las Polaroids con oscilaciones suaves */

        @keyframes caerFotos {

            0% {
                top: -220px;
                opacity: 0;
                transform: rotate(-10deg) translateX(0px);
            }

            8% {
                opacity: 1;
            }

            50% {
                transform: rotate(10deg) translateX(25px);
            }

            92% {
                opacity: 1;
            }

            100% {
                top: 108vh;
                opacity: 0;
                transform: rotate(-8deg) translateX(-20px);
            }

        }

        /* Tiempos y Posiciones Horizontales Variadas */

        .card--1  { left: 4%;  animation-duration: 15s; animation-delay: 0s; }
        .card--2  { left: 19%; animation-duration: 18s; animation-delay: 2.8s; }
        .card--3  { left: 34%; animation-duration: 16s; animation-delay: 1s; }
        .card--4  { left: 49%; animation-duration: 19s; animation-delay: 4.2s; }
        .card--5  { left: 64%; animation-duration: 14s; animation-delay: 0.4s; }
        .card--6  { left: 79%; animation-duration: 17s; animation-delay: 5s; }
        .card--7  { left: 11%; animation-duration: 16s; animation-delay: 7.5s; }
        .card--8  { left: 26%; animation-duration: 14s; animation-delay: 9.5s; }
        .card--9  { left: 41%; animation-duration: 20s; animation-delay: 6.5s; }
        .card--10 { left: 56%; animation-duration: 15s; animation-delay: 8.5s; }
        .card--11 { left: 71%; animation-duration: 17s; animation-delay: 11s; }
        .card--12 { left: 86%; animation-duration: 13s; animation-delay: 2s; }

        /* Modal Preview Animation */

        @keyframes zoomModal {

            0% { 
                transform: scale(0.5) translateY(50px) rotate(-5deg); 
                opacity: 0; 
                filter: blur(10px);
            }

            100% { 
                transform: scale(1) translateY(0) rotate(0deg); 
                opacity: 1; 
                filter: blur(0);
            }

        }

        .modal-animacion {
            animation: zoomModal 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Animación de Latido para el Botón de Like */

        @keyframes latido {

            0%, 100% { transform: scale(1); }

            50% { transform: scale(1.15); }

        }

        .anim-latido {
            animation: latido 0.6s ease infinite;
        }

        /* Partículas flotantes de Clic */

        .particula-clic {

            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 1.5rem;
            animation: flotarParticula 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;

        }

        @keyframes flotarParticula {

            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
            }

            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot));
            }

        }

        /* Responsive Tweaks */

        @media (max-width: 768px) {

            .marco-polaroid {
                width: 105px;
                padding: 6px 6px 10px 6px;
            }

            .marco-polaroid img {
                height: 95px;
            }

            .nota {
                font-size: 0.95rem;
            }

        }

    </style>

</head>

    <script>

        document.addEventListener('DOMContentLoaded', () => {

            /* =====================================================
               1. REPRODUCTOR DE MÚSICA
            ===================================================== */

            let isPlaying = false;

            const btnMusica = document.getElementById('btnMusica');
            const iconoMusica = document.getElementById('iconoMusica');
            const textoMusica = document.getElementById('textoMusica');
            const musicaFondo = document.getElementById('musicaFondo');

            btnMusica.addEventListener('click', async () => {

                if (!isPlaying) {

                    try {

                        await musicaFondo.play();

                        isPlaying = true;

                        textoMusica.textContent = 'Música: ON';
                        iconoMusica.textContent = '🎶';

                        btnMusica.classList.add(
                            'ring-2',
                            'ring-amber-300'
                        );

                    } catch (error) {

                        console.error('No se pudo reproducir la música:', error);

                        textoMusica.textContent = 'Error de música';
                        iconoMusica.textContent = '⚠️';

                        setTimeout(() => {

                            textoMusica.textContent = 'Música: OFF';
                            iconoMusica.textContent = '🎵';

                        }, 2000);

                    }

                } else {

                    musicaFondo.pause();

                    isPlaying = false;

                    textoMusica.textContent = 'Música: OFF';
                    iconoMusica.textContent = '🎵';

                    btnMusica.classList.remove(
                        'ring-2',
                        'ring-amber-300'
                    );

                }

            });


            /* =====================================================
               2. CANVAS DE GALAXIA Y ESTRELLAS FUGACES
            ===================================================== */

            const canvas = document.getElementById('galaxia');
            const ctx = canvas.getContext('2d');

            let width, height;

            function resize() {

                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;

            }

            window.addEventListener('resize', resize);
            resize();


            // Estrellas

            const NUM_ESTRELLAS = 200;
            const estrellas = [];

            for (let i = 0; i < NUM_ESTRELLAS; i++) {

                estrellas.push({

                    x: Math.random() * width,
                    y: Math.random() * height,
                    tamano: Math.random() * 2.2 + 0.5,
                    alfa: Math.random(),
                    velocidad: Math.random() * 0.02 + 0.005

                });

            }


            // Pétalos de Girasol

            const NUM_PETALOS = 45;
            const petalos = [];

            for (let i = 0; i < NUM_PETALOS; i++) {

                petalos.push({

                    x: Math.random() * width,
                    y: Math.random() * height,
                    tamano: Math.random() * 8 + 5,
                    velocidadY: Math.random() * 1.2 + 0.6,
                    velocidadX: Math.random() * 0.8 - 0.4,
                    rotacion: Math.random() * 360,
                    vRotacion: Math.random() * 2 - 1,
                    color: Math.random() > 0.35 ? '#fbbf24' : '#f59e0b'

                });

            }


            // Estrellas Fugaces

            let estellaFugaz = null;

            function crearEstrellaFugaz() {

                if (Math.random() < 0.015 && !estellaFugaz) {

                    estellaFugaz = {

                        x: Math.random() * width,
                        y: Math.random() * (height / 2),
                        largo: Math.random() * 80 + 50,
                        speed: Math.random() * 10 + 6,
                        alfa: 1

                    };

                }

            }


            function animarGalaxia() {

                ctx.fillStyle = 'rgba(3, 1, 8, 0.35)';
                ctx.fillRect(0, 0, width, height);


                // Dibujar Estrellas

                for (let i = 0; i < NUM_ESTRELLAS; i++) {

                    const e = estrellas[i];

                    e.alfa += e.velocidad;

                    if (e.alfa > 1 || e.alfa < 0)
                        e.velocidad = -e.velocidad;

                    ctx.beginPath();

                    ctx.arc(
                        e.x,
                        e.y,
                        e.tamano,
                        0,
                        Math.PI * 2
                    );

                    ctx.fillStyle = '#ffffff';

                    ctx.globalAlpha = Math.abs(e.alfa);

                    ctx.fill();

                }


                // Dibujar Estrella Fugaz

                crearEstrellaFugaz();

                if (estellaFugaz) {

                    ctx.beginPath();

                    ctx.moveTo(
                        estellaFugaz.x,
                        estellaFugaz.y
                    );

                    ctx.lineTo(
                        estellaFugaz.x - estellaFugaz.largo,
                        estellaFugaz.y + estellaFugaz.largo
                    );

                    ctx.strokeStyle =
                        'rgba(255, 230, 150, ' +
                        estellaFugaz.alfa +
                        ')';

                    ctx.lineWidth = 2;

                    ctx.stroke();

                    estellaFugaz.x += estellaFugaz.speed;
                    estellaFugaz.y += estellaFugaz.speed;
                    estellaFugaz.alfa -= 0.02;

                    if (estellaFugaz.alfa <= 0)
                        estellaFugaz = null;

                }


                // Dibujar Pétalos

                for (let i = 0; i < NUM_PETALOS; i++) {

                    const p = petalos[i];

                    p.y += p.velocidadY;
                    p.x += p.velocidadX;
                    p.rotacion += p.vRotacion;

                    if (p.y > height + 20) {

                        p.y = -20;
                        p.x = Math.random() * width;

                    }

                    ctx.save();

                    ctx.translate(p.x, p.y);

                    ctx.rotate(
                        (p.rotacion * Math.PI) / 180
                    );

                    ctx.beginPath();

                    ctx.ellipse(
                        0,
                        0,
                        p.tamano,
                        p.tamano / 2.2,
                        0,
                        0,
                        Math.PI * 2
                    );

                    ctx.fillStyle = p.color;

                    ctx.globalAlpha = 0.85;

                    ctx.shadowColor = '#f59e0b';

                    ctx.shadowBlur = 8;

                    ctx.fill();

                    ctx.restore();

                }

                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1.0;

                requestAnimationFrame(animarGalaxia);

            }

            animarGalaxia();


            /* =====================================================
               3. CONTROLES DE PAUSA / REANUDAR LLUVIA
            ===================================================== */

            const btnVelocidad = document.getElementById('btnVelocidad');
            const fotoCards = document.querySelectorAll('.foto-card');

            let caidaPausada = false;

            btnVelocidad.addEventListener('click', () => {

                caidaPausada = !caidaPausada;

                fotoCards.forEach(card => {

                    card.style.animationPlayState =
                        caidaPausada ? 'paused' : 'running';

                });

                btnVelocidad.innerHTML = caidaPausada

                    ? '<span>▶️ Reanudar Lluvia</span>'

                    : '<span>⚡ Pausar Lluvia</span>';

            });


            /* =====================================================
               4. EXPLOSIÓN DE CORAZONES (EFECTO INTERACTIVO)
            ===================================================== */

            function dispararExplosion(x, y) {

                const simbolos = [
                    '❤️',
                    '🌻',
                    '✨',
                    '💛',
                    '💖'
                ];

                for (let i = 0; i < 12; i++) {

                    const el = document.createElement('span');

                    el.className = 'particula-clic';

                    el.textContent =
                        simbolos[
                            Math.floor(
                                Math.random() * simbolos.length
                            )
                        ];

                    el.style.left = `${x}px`;
                    el.style.top = `${y}px`;

                    const angle =
                        Math.random() * Math.PI * 2;

                    const dist =
                        Math.random() * 120 + 40;

                    const tx =
                        Math.cos(angle) * dist + 'px';

                    const ty =
                        Math.sin(angle) * dist + 'px';

                    const rot =
                        Math.random() * 360 + 'deg';

                    el.style.setProperty('--tx', tx);
                    el.style.setProperty('--ty', ty);
                    el.style.setProperty('--rot', rot);

                    document.body.appendChild(el);

                    setTimeout(
                        () => el.remove(),
                        1000
                    );

                }

            }


            /* =====================================================
               5. VISOR MODAL DE RECUERDOS (ZOOM & DETALLES)
            ===================================================== */

            const visorModal =
                document.getElementById('visorModal');

            const modalImg =
                document.getElementById('modalImg');

            const modalTitulo =
                document.getElementById('modalTitulo');

            const modalSub =
                document.getElementById('modalSub');

            const cerrarVisor =
                document.getElementById('cerrarVisor');

            const btnLike =
                document.getElementById('btnLike');

            const likeIcon =
                document.getElementById('likeIcon');

            const likeText =
                document.getElementById('likeText');


            fotoCards.forEach(card => {

                card.addEventListener('click', (e) => {

                    dispararExplosion(
                        e.clientX,
                        e.clientY
                    );

                    const imgSrc =
                        card.querySelector('img').src;

                    const titulo =
                        card.getAttribute('data-titulo') ||
                        'Recuerdo Especial';

                    const sub =
                        card.getAttribute('data-sub') ||
                        'Momentos inolvidables juntos';

                    modalImg.src = imgSrc;

                    modalTitulo.textContent = titulo;

                    modalSub.textContent = sub;

                    likeText.textContent = 'Me encanta';

                    likeIcon.classList.remove(
                        'anim-latido'
                    );

                    visorModal.classList.remove('hidden');

                });

            });


            btnLike.addEventListener('click', (e) => {

                dispararExplosion(
                    e.clientX,
                    e.clientY
                );

                likeText.textContent =
                    '¡Guardado con amor! ❤️';

                likeIcon.classList.add(
                    'anim-latido'
                );

            });


            const cerrarModal = () => {

                visorModal.classList.add('hidden');

            };


            cerrarVisor.addEventListener(
                'click',
                cerrarModal
            );


            visorModal.addEventListener(
                'click',
                (e) => {

                    if (e.target === visorModal)
                        cerrarModal();

                }
            );

        });

    </script>

</body>

</html>
