<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galaxia de Girasoles 🌻</title>

    <link rel="stylesheet" href="galaxia.css">
</head>

<body>

    <div class="galaxia">

        <!-- Fondo de estrellas -->
        <div id="estrellas"></div>

        <!-- Luna -->
        <div class="luna"></div>

        <!-- Brillos -->
        <div id="brillos"></div>

        <!-- Girasol 1 -->
        <div class="girasol girasol1">

            <div class="tallo"></div>

            <div class="hoja hoja-izquierda"></div>
            <div class="hoja hoja-derecha"></div>

            <div class="flor">

                <div class="petalo petalo1"></div>
                <div class="petalo petalo2"></div>
                <div class="petalo petalo3"></div>
                <div class="petalo petalo4"></div>
                <div class="petalo petalo5"></div>
                <div class="petalo petalo6"></div>
                <div class="petalo petalo7"></div>
                <div class="petalo petalo8"></div>

                <div class="centro"></div>

            </div>

        </div>


        <!-- Girasol 2 -->
        <div class="girasol girasol2">

            <div class="tallo"></div>

            <div class="hoja hoja-izquierda"></div>
            <div class="hoja hoja-derecha"></div>

            <div class="flor">

                <div class="petalo petalo1"></div>
                <div class="petalo petalo2"></div>
                <div class="petalo petalo3"></div>
                <div class="petalo petalo4"></div>
                <div class="petalo petalo5"></div>
                <div class="petalo petalo6"></div>
                <div class="petalo petalo7"></div>
                <div class="petalo petalo8"></div>

                <div class="centro"></div>

            </div>

        </div>


        <!-- Girasol 3 -->
        <div class="girasol girasol3">

            <div class="tallo"></div>

            <div class="hoja hoja-izquierda"></div>
            <div class="hoja hoja-derecha"></div>

            <div class="flor">

                <div class="petalo petalo1"></div>
                <div class="petalo petalo2"></div>
                <div class="petalo petalo3"></div>
                <div class="petalo petalo4"></div>
                <div class="petalo petalo5"></div>
                <div class="petalo petalo6"></div>
                <div class="petalo petalo7"></div>
                <div class="petalo petalo8"></div>

                <div class="centro"></div>

            </div>

        </div>


        <!-- Pasto -->
        <div class="pasto"></div>


        <!-- Texto -->
        <div class="mensaje">

            <div class="emoji">🌻</div>

            <div class="texto">
                Para ti
            </div>

        </div>

    </div>


    <script src="galaxia.js"></script>

</body>

</html>
